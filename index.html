<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ubey Hub V3 - Key Generator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f0f15; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background: #181824; border: 2px solid #00a2ff; border-radius: 15px; padding: 30px; width: 100%; max-width: 420px; text-align: center; box-shadow: 0 0 20px rgba(0, 162, 255, 0.2); }
        h1 { color: #00a2ff; font-size: 22px; margin-bottom: 10px; }
        p { color: #aaa; font-size: 13px; margin-bottom: 25px; }
        .key-box { background: #252535; border: 1px solid #353545; border-radius: 8px; padding: 12px; font-size: 16px; font-weight: bold; color: #00ff88; letter-spacing: 1px; word-break: break-all; margin-bottom: 20px; min-height: 48px; display: flex; align-items: center; justify-content: center; }
        .btn { background: #00a2ff; color: #fff; border: none; border-radius: 8px; padding: 12px 20px; font-size: 14px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.2s; }
        .btn:hover { background: #0082cc; }
        .status { margin-top: 15px; font-size: 12px; color: #ffaa00; }
    </style>
</head>
<body>

<div class="container">
    <h1>UBEY HUB V3 KEY</h1>
    <p>Terima kasih telah melewati iklan! Klik tombol di bawah untuk membuat dan menyalin Key kamu.</p>
    
    <div class="key-box" id="keyDisplay">Membuat Key...</div>
    <button class="btn" onclick="copyKey()">📋 Salin Key</button>
    <div class="status" id="statusText">Menghubungkan ke server...</div>
</div>

<script>
    const SUPABASE_URL = "https://vwwxvemxeztfiyuurhro.supabase.co/rest/v1/Ubey_Project";
    const SUPABASE_KEY = "sb_publishable_8_TpNisUFO-E3rEvqonNvA_RLPy9PX5";

    // Fungsi membuat string acak 12 karakter
    function generateRandomString(length) {
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
        let result = '';
        for (let i = 0; i < length; i++) {
            result += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return result;
    }

    async function generateAndSaveKey() {
        const statusEl = document.getElementById("statusText");
        const keyEl = document.getElementById("keyDisplay");
        
        // Buat key berawalan UBEY-
        const generatedKey = "UBEY-" + generateRandomString(12);

        try {
            // Simpan ke Supabase (Kolom key_value)
            const response = await fetch(SUPABASE_URL, {
                method: "POST",
                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization": "Bearer " + SUPABASE_KEY,
                    "Content-Type": "application/json",
                    "Prefer": "return=minimal"
                },
                body: JSON.stringify({
                    key_value: generatedKey
                })
            });

            if (response.ok) {
                keyEl.innerText = generatedKey;
                statusEl.style.color = "#00ff88";
                statusEl.innerText = "✅ Key berhasil dibuat & terdaftar di Database!";
            } else {
                const errText = await response.text();
                keyEl.innerText = "Gagal!";
                statusEl.style.color = "#ff4444";
                statusEl.innerText = "❌ Gagal menyimpan ke Database (Cek RLS/Supabase)";
                console.error("Supabase Error:", errText);
            }
        } catch (err) {
            keyEl.innerText = "Error!";
            statusEl.style.color = "#ff4444";
            statusEl.innerText = "❌ Kesalahan jaringan / koneksi server.";
            console.error(err);
        }
    }

    function copyKey() {
        const keyText = document.getElementById("keyDisplay").innerText;
        const statusEl = document.getElementById("statusText");
        if (keyText.startsWith("UBEY-")) {
            navigator.clipboard.writeText(keyText);
            statusEl.style.color = "#00a2ff";
            statusEl.innerText = "📋 Key berhasil disalin ke Clipboard!";
        }
    }

    // Jalankan otomatis saat halaman dibuka
    generateAndSaveKey();
</script>

</body>
</html>
