<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ubey Hub V3 - Key Generator</title>
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0d1117; color: #c9d1d9; text-align: center; padding: 40px 15px; }
        .container { background: #161b22; padding: 25px; border-radius: 12px; display: inline-block; box-shadow: 0 4px 15px rgba(0,0,0,0.6); max-width: 400px; width: 100%; border: 1px solid #30363d; }
        h1 { color: #58a6ff; font-size: 20px; margin-bottom: 10px; }
        .btn { background: #238636; color: white; padding: 12px 20px; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 15px; width: 100%; box-sizing: border-box; }
        .btn:disabled { background: #30363d; color: #8b949e; cursor: not-allowed; border: 1px solid #484f58; }
        .btn:hover:not(:disabled) { background: #2ea043; }
        .error { color: #f85149; font-size: 14px; font-weight: bold; }
        #status-msg { margin-top: 15px; font-size: 13px; word-break: break-all; }
    </style>
</head>
<body>

    <div class="container" id="main-container">
        <!-- Konten diatur oleh JS -->
    </div>

    <script>
        // Kredensial Supabase Kamu
        const SUPABASE_URL = "https://vwwxvemxeztfiyuurhro.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_8_TpNisUFO-E3rEvqonNvA_RLPy9PX5";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Nama Tabel di Supabase
        const TABLE_NAME = "Ubey_Project";

        // Token Rahasia Linkvertise
        const SECRET_TOKEN = "ubey_secret_pass_2026";
        
        // Membaca token dari URL (?token= atau #token=)
        const urlParams = new URLSearchParams(window.location.search);
        let userToken = urlParams.get('token');
        if (!userToken && window.location.hash) {
            const hashParams = new URLSearchParams(window.location.hash.substring(1));
            userToken = hashParams.get('token');
        }

        const container = document.getElementById('main-container');

        if (userToken === SECRET_TOKEN) {
            container.innerHTML = `
                <h1>Ubey Hub V3 - Key Generator</h1>
                <p style="font-size: 13px; color: #8b949e;">Klik tombol di bawah untuk membuat Key baru yang berlaku selama 24 jam.</p>
                <button class="btn" id="gen-btn" onclick="generateAndSaveKey()">Generate Key Baru</button>
                <p id="status-msg"></p>
            `;
            
            // Cek apakah ada key aktif yang tersimpan
            checkExistingKey();
        } else {
            container.innerHTML = `
                <h1 style="color: #f85149;">❌ Akses Ditolak!</h1>
                <p class="error">Anda harus melewati link iklan terlebih dahulu untuk mengakses halaman ini.</p>
            `;
        }

        // Fungsi mengecek status key di browser
        function checkExistingKey() {
            const savedKey = localStorage.getItem('ubey_user_key');
            const savedTime = localStorage.getItem('ubey_key_time');
            
            if (savedKey && savedTime) {
                const now = new Date().getTime();
                const hoursPassed = (now - parseInt(savedTime)) / (1000 * 60 * 60);
                
                // Jika key belum lewat dari 24 jam, tampilkan key lama yang masih aktif
                if (hoursPassed < 24) {
                    const btn = document.getElementById('gen-btn');
                    const statusMsg = document.getElementById('status-msg');
                    
                    if (btn) btn.style.display = "none";
                    if (statusMsg) {
                        statusMsg.style.color = "#3fb950";
                        statusMsg.innerHTML = "✅ Key Anda Masih Aktif:<br><b style='font-size: 17px; margin-top:8px; display:inline-block; color:#58a6ff;'>" + savedKey + "</b><br><span style='font-size:11px; color:#8b949e;'>Key ini berlaku selama 24 jam sejak pertama diambil.</span>";
                    }
                    return;
                }
            }
            
            // Jika sudah lewat 24 jam atau belum ada, hapus data lama agar siap buat baru
            localStorage.removeItem('ubey_user_key');
            localStorage.removeItem('ubey_key_time');
        }

        // Fungsi Pembuat Karakter Acak Unik
        function generateRandomString(length) {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let result = '';
            for (let i = 0; i < length; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        async function generateAndSaveKey() {
            const btn = document.getElementById('gen-btn');
            const statusMsg = document.getElementById('status-msg');

            btn.disabled = true;
            statusMsg.style.color = "#e3b341";
            statusMsg.innerText = "⏳ Sedang mendaftarkan key baru ke database...";

            const randomCode = generateRandomString(10);
            const generatedKey = "UBEY-V3-" + randomCode;

            try {
                // Simpan Key acak baru ke Supabase
                const { data, error } = await supabaseClient
                    .from(TABLE_NAME) 
                    .insert([
                        { 
                            key_value: generatedKey, 
                            status: "active"
                        }
                    ]);

                if (error) {
                    console.error("Supabase Error:", error);
                    statusMsg.style.color = "#f85149";
                    statusMsg.innerText = "⚠️ Gagal Simpan DB: " + error.message;
                    btn.disabled = false;
                } else {
                    // Simpan key dan waktu saat ini di memori browser (berlaku 24 jam)
                    localStorage.setItem('ubey_user_key', generatedKey);
                    localStorage.setItem('ubey_key_time', new Date().getTime().toString());

                    btn.style.display = "none";
                    statusMsg.style.color = "#3fb950";
                    statusMsg.innerHTML = "✅ Key Baru Berhasil Dibuat!<br><b style='font-size: 17px; margin-top:8px; display:inline-block; color:#58a6ff;'>" + generatedKey + "</b>";
                    
                    if (navigator.clipboard) {
                        navigator.clipboard.writeText(generatedKey);
                    }
                }

            } catch (err) {
                console.error("Catch Error:", err);
                statusMsg.style.color = "#f85149";
                statusMsg.innerText = "❌ Terjadi Kesalahan Koneksi.";
                btn.disabled = false;
            }
        }
    </script>

</body>
</html>
